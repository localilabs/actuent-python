name: Publish to PyPI
# Runs when a GitHub release is published. Uses PyPI trusted publishing (no token needed):
# on pypi.org add a trusted publisher for this repo and the workflow "publish.yml".
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
