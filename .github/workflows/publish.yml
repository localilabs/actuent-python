name: Publish to PyPI
# One click for a release: Actions → Publish to PyPI → Run workflow → type the new version (e.g. 0.8.0).
# It sets the version (pyproject.toml and __init__.py), commits and tags it, builds, publishes with PyPI
# trusted publishing (no token: pypi.org trusts this repo's "publish.yml") and makes the GitHub release.
# Leave the version empty to publish what's already there. Also runs when a release is published by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 0.8.0 (empty: publish the current one)'
        default: ''
        required: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set the version
        if: ${{ github.event.inputs.version != '' && github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must look like 1.2.3"; exit 1; }
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"$VERSION\"/" src/actuent/__init__.py
          git config user.name "Alfred Murray"
          git config user.email "alfredcasper1010@gmail.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        if: ${{ github.event.inputs.version != '' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: gh release create "v$VERSION" dist/* --title "actuent $VERSION" --generate-notes
