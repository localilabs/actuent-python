[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "actuent"
version = "0.7.0"
description = "Python SDK for Actuent — the search engine for AI agents. Websites and products as structured LAWP, plus LangChain and LlamaIndex tools."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "localilabs", email = "support@localilabs.com" }]
requires-python = ">=3.8"
keywords = ["ai", "agents", "search", "lawp", "mcp", "langchain", "llamaindex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]

[project.urls]
Homepage = "https://actuent.ai"
Documentation = "https://docs.actuent.ai"
Source = "https://github.com/localilabs/actuent-python"

[tool.setuptools.packages.find]
where = ["src"]
